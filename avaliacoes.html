<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliações | GTEC Info Cell</title>
<style>
  :root{--bg:#05070d;--card:#0c1220;--txt:#e8eefc;--mut:#8a97b5;--blue:#1e90ff;--star:#ffd21f;--line:#1a2742}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}
  #avaliacoes{max-width:1000px;margin:0 auto;padding:48px 20px}
  #avaliacoes h2{text-align:center;font-size:clamp(24px,4vw,34px);margin:0 0 8px;text-transform:uppercase}
  #avaliacoes h2 span{color:var(--blue);text-shadow:0 0 14px rgba(30,144,255,.7)}
  .sub{text-align:center;color:var(--mut);margin:0 0 32px}
  .lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .nome{font-weight:bold}
  .card .estrelas{color:var(--star);letter-spacing:2px;margin:6px 0}
  .card p{margin:0;color:#cfd8ee;line-height:1.45;overflow-wrap:anywhere}
  .vazio{grid-column:1/-1;text-align:center;color:var(--mut)}
  form{background:var(--card);border:1px solid var(--blue);box-shadow:0 0 22px rgba(30,144,255,.25);border-radius:14px;padding:22px;max-width:560px;margin:0 auto}
  form h3{margin:0 0 14px;text-align:center}
  label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
  input[type=text],textarea{width:100%;background:#070b15;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:11px;font:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--blue)}
  textarea{min-height:100px;resize:vertical}
  .stars{display:flex;flex-direction:row-reverse;justify-content:center;gap:8px;font-size:38px}
  .stars input{display:none}
  .stars label{margin:0;cursor:pointer;color:#2a3654;transition:color .15s}
  .stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--star)}
  .hp{position:absolute;left:-9999px}
  button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 0 16px rgba(30,144,255,.6)}
  button:disabled{opacity:.6;cursor:wait}
  .msg{text-align:center;margin-top:14px;min-height:20px}
  .ok{color:#4ade80}.erro{color:#ff6b6b}
</style>
<link rel="icon" type="image/png" href="img/logo.jpeg">
</head>
<body>

<!-- ===== COLE DAQUI ATÉ O FIM DO </section> NO SEU SITE (junto com o <style> e o <script>) ===== -->
<section id="avaliacoes">
  <h2>O que dizem nossos <span>clientes</span></h2>
  <p class="sub">Sua opinião ajuda a GTEC a melhorar a cada atendimento.</p>

  <div class="lista" id="lista"><p class="vazio">Carregando avaliações…</p></div>

  <form id="form" novalidate>
    <h3>Avalie nosso serviço</h3>
    <div class="stars" role="radiogroup" aria-label="Nota de 1 a 5">
      <input type="radio" name="nota" id="s5" value="5"><label for="s5" title="5 estrelas">★</label>
      <input type="radio" name="nota" id="s4" value="4"><label for="s4" title="4 estrelas">★</label>
      <input type="radio" name="nota" id="s3" value="3"><label for="s3" title="3 estrelas">★</label>
      <input type="radio" name="nota" id="s2" value="2"><label for="s2" title="2 estrelas">★</label>
      <input type="radio" name="nota" id="s1" value="1"><label for="s1" title="1 estrela">★</label>
    </div>

    <label for="nome">Seu nome</label>
    <input type="text" id="nome" maxlength="60" placeholder="Ex.: Kevin Miguel" required>

    <label for="comentario">Gostou do serviço? Conte para nós</label>
    <textarea id="comentario" maxlength="500" placeholder="Como foi seu atendimento, o prazo e o resultado do conserto?" required></textarea>

    <input class="hp" type="text" id="site" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" id="btn">Enviar avaliação</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</section>

<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyd2KLPeYGUc1IO1FC-qpqzgWmKiD9bmTP3eUTARtCw_YgVfCfuvnYMNsebeas-lLCrwA/exec';

  const lista = document.getElementById('lista');
  const form  = document.getElementById('form');
  const msg   = document.getElementById('msg');
  const btn   = document.getElementById('btn');

  function mostrarAvaliacoes(itens){
    lista.textContent = '';
    if(!itens.length){
      const p = document.createElement('p'); p.className = 'vazio';
      p.textContent = 'Seja o primeiro a avaliar!'; lista.appendChild(p); return;
    }
    itens.forEach(a => {
      const c = document.createElement('div'); c.className = 'card';
      const n = document.createElement('div'); n.className = 'nome'; n.textContent = a.nome || 'Cliente';
      const e = document.createElement('div'); e.className = 'estrelas';
      const nota = Math.max(1, Math.min(5, parseInt(a.nota) || 5));
      e.textContent = '★'.repeat(nota) + '☆'.repeat(5 - nota);
      const t = document.createElement('p'); t.textContent = a.comentario || '';
      c.append(n, e, t); lista.appendChild(c);
    });
  }

  async function carregar(){
    if(ENDPOINT.startsWith('COLE_')){ mostrarAvaliacoes([]); return; }
    try{
      const r = await fetch(ENDPOINT);
      mostrarAvaliacoes(await r.json());
    }catch(err){
      lista.innerHTML = '';
      const p = document.createElement('p'); p.className = 'vazio';
      p.textContent = 'Não foi possível carregar as avaliações agora.'; lista.appendChild(p);
    }
  }

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    msg.className = 'msg';
    const nota = (form.querySelector('input[name=nota]:checked') || {}).value;
    const nome = document.getElementById('nome').value.trim();
    const comentario = document.getElementById('comentario').value.trim();
    if(!nota || !nome || !comentario){
      msg.textContent = 'Escolha as estrelas e preencha nome e comentário.'; msg.classList.add('erro'); return;
    }
    if(ENDPOINT.startsWith('COLE_')){
      msg.textContent = 'Falta configurar a URL do Apps Script (veja o passo a passo).'; msg.classList.add('erro'); return;
    }
    btn.disabled = true; msg.textContent = 'Enviando…';
    try{
      await fetch(ENDPOINT, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({nota, nome, comentario, site: document.getElementById('site').value})
      });
      form.reset();
      msg.textContent = 'Obrigado pela sua avaliação! Ela aparecerá no site após a aprovação.';
      msg.classList.add('ok');
    }catch(err){
      msg.textContent = 'Erro ao enviar. Tente novamente em instantes.'; msg.classList.add('erro');
    }finally{ btn.disabled = false; }
  });

  carregar();
</script>
</body>
</html>
